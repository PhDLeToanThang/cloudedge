# Cloud9 Nginx Reverse Proxy Configuration
# =========================================
# Sử dụng: Đặt file này vào /etc/nginx/sites-available/cloud9
#          Sau đó ln -sf vào /etc/nginx/sites-enabled/
#
# Biến cần thay:
#   {{DOMAIN}}     — Tên miền (vd: c9.example.com)
#   {{SSL_CERT}}   — Path SSL certificate
#   {{SSL_KEY}}    — Path SSL private key

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name {{DOMAIN}};
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name {{DOMAIN}};

    # SSL certificates
    ssl_certificate     {{SSL_CERT}};
    ssl_certificate_key {{SSL_KEY}};

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:\
ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    # Main proxy — WebSocket support (required for Cloud9 terminal)
    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Static files — cache for performance
    location /static/ {
        proxy_pass http://127.0.0.1:8181/static/;
        proxy_cache_valid 200 302 60m;
        proxy_cache_valid 404 1m;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to sensitive paths
    location ~ /\.(git|env|svn) {
        deny all;
        return 404;
    }

    # Large uploads for workspace files
    client_max_body_size 100M;
}
